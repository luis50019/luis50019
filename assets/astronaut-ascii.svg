  <defs>
    <style>
      .ascii-row {
        fill: #60A5FA;
        font-size: 9.0px;
        white-space: pre;
        text-anchor: start;
      }
      .wipe {
        transform-box: fill-box;
        transform-origin: left center;
        animation: wipe 0.5s cubic-bezier(0.22,1,0.36,1) forwards;
      }
      .cur {
        fill: #93C5FD;
        opacity: 0;
        transform-box: fill-box;
        transform-origin: left center;
        animation: slide 0.5s cubic-bezier(0.22,1,0.36,1) forwards;
      }
      @keyframes wipe {
        from { transform: scaleX(0); }
        to   { transform: scaleX(1); }
      }
      @keyframes slide {
        from { transform: translateX(0); opacity: 0; }
        10%  { opacity: 1; }
        to   { transform: translateX(361.8px); opacity: 1; }
      }
    </style>
