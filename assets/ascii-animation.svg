<svg viewBox="0 0 301 292" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, Consolas, monospace">
  <defs>
    <style>
      .bg { fill: #0B1020; }
      .frame { fill: none; stroke: #1E3A8A; stroke-width: 2; rx: 10; }
      .dot { opacity: 0.9; }
      .ascii-row {
        fill: #60A5FA;
        font-size: 6.2px;
        white-space: pre;
        opacity: 0;
        animation: reveal 0.05s ease-out forwards;
      }
      .cursor {
        fill: #93C5FD;
        animation: blink 0.9s steps(1) infinite;
      }
      @keyframes reveal {
        to { opacity: 1; }
      }
      @keyframes blink {
        50% { opacity: 0; }
      }
      .title {
        fill: #93C5FD;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1px;
      }
    </style>
  </defs>
